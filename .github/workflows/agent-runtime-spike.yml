name: Agent runtime spike

on:
  pull_request:
    paths:
      - '.github/workflows/agent-runtime-spike.yml'
      - 'ci/**'
      - 'custom_nodes/agent_workflow_studio/test_langgraph_spike.py'
      - 'docs/workflow-evolution/AGENT-RUNTIME-*.md'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - '.github/workflows/agent-runtime-spike.yml'
      - 'ci/**'
      - 'custom_nodes/agent_workflow_studio/test_langgraph_spike.py'
      - 'docs/workflow-evolution/AGENT-RUNTIME-*.md'
  workflow_dispatch:
    inputs:
      publish_evidence:
        description: Deliver synthetic spike evidence, not a production release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: agent-runtime-spike-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMFYUI_LANGGRAPH_SPIKE_ALLOWED: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.9.27'
          enable-cache: false
      - name: Install hash-locked SDK into isolated environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --no-config --default-index https://pypi.org/simple --python .venv/bin/python --require-hashes --only-binary :all: -r ci/requirements-langgraph-spike.lock
          uv pip check --python .venv/bin/python
      - name: Validate CI policy, runner admission and source syntax
        run: |
          .venv/bin/python -m unittest discover -s ci -p 'test_*.py' -v
          .venv/bin/python -m py_compile ci/run_langgraph_spike.py custom_nodes/agent_workflow_studio/test_langgraph_spike.py
      - name: Run real SDK fixtures and require no skips
        run: .venv/bin/python ci/run_langgraph_spike.py --report "${{ runner.temp }}/langgraph-spike-report.json"
      - name: Deliver synthetic evidence on explicit manual dispatch
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish_evidence }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: langgraph-synthetic-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/langgraph-spike-report.json
            ci/requirements-langgraph-spike.in
            ci/requirements-langgraph-spike.lock
            ci/run_langgraph_spike.py
            custom_nodes/agent_workflow_studio/test_langgraph_spike.py
            docs/workflow-evolution/AGENT-RUNTIME-EVALUATION.md
          if-no-files-found: error
          retention-days: 7
